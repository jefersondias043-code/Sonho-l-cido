name: Publicar no GitHub Pages

# Cada envio para a main reconstrói o WebAssembly e republica o site. Não há
# passo manual: o que está na main é o que está no ar.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Publica empurrando o conteúdo para a branch `gh-pages`.
#
# O caminho "oficial" (actions/configure-pages + deploy-pages) exige que o
# GitHub Pages já esteja habilitado nas configurações do repositório, e o token
# do fluxo não tem permissão para habilitá-lo — nem com `enablement: true`. Isso
# criava um impasse: a primeira publicação sempre falhava até alguém abrir as
# configurações manualmente.
#
# Uma branch chamada `gh-pages` liga o Pages sozinha na primeira vez que
# aparece. Só precisa de permissão de escrita no repositório, que o fluxo já
# tem.
permissions:
  contents: write

concurrency:
  group: pages
  # Um envio novo cancela o anterior que ainda está rodando. Com `false`, três
  # envios seguidos faziam o terceiro esperar a fila inteira antes de começar —
  # e o que ele publicaria já contém o que os dois primeiros publicariam, então
  # a espera não comprava garantia nenhuma: comprava só atraso.
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar o alvo WebAssembly
        run: rustup target add wasm32-unknown-unknown

      - name: Descobrir a versão exigida do wasm-bindgen
        id: versao
        run: |
          # A biblioteca e a ferramenta precisam ser exatamente da mesma versão:
          # elas trocam dados por um formato interno que ainda muda. Ler a
          # versão do Cargo.toml evita que a CI e o desenvolvimento divirjam.
          versao=$(grep -oP 'wasm-bindgen = "=\K[0-9.]+' crates/motor-web/Cargo.toml)
          echo "wasm_bindgen=$versao" >> "$GITHUB_OUTPUT"
          echo "wasm-bindgen exigido: $versao"

      - name: Reaproveitar compilações anteriores
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: wasm-${{ runner.os }}-${{ steps.versao.outputs.wasm_bindgen }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            wasm-${{ runner.os }}-${{ steps.versao.outputs.wasm_bindgen }}-

      - name: Instalar o wasm-bindgen
        run: |
          instalada=$(wasm-bindgen --version 2>/dev/null | awk '{print $2}' || echo "")
          if [ "$instalada" != "${{ steps.versao.outputs.wasm_bindgen }}" ]; then
            cargo install wasm-bindgen-cli \
              --version "${{ steps.versao.outputs.wasm_bindgen }}" --force
          else
            echo "já instalada"
          fi

      - name: Rodar os testes
        run: cargo test --workspace

      - name: Construir o site
        run: ./construir-web.sh

      - name: Testar a construção
        # Propriedades que só se manifestam entre uma construção e outra:
        # o carimbo da versão reagir a qualquer mudança, e a lista de uso sem
        # internet cobrir todo o site. Nenhum teste de navegador as alcança.
        run: ./testar-construcao.sh

      - name: Testar o veredito
        # O módulo que decide o que o aplicativo tem direito de afirmar. Era o
        # único sem teste próprio, e foi por isso que um defeito grave
        # sobreviveu: parar no meio fazia a tela relatar cartelas que não
        # existiam.
        run: node web/testar-veredito.mjs

      - name: Testar o histórico e o arquivo de fechamento
        # Também em node puro. Um histórico que perde trabalho é pior do que não
        # ter histórico: quem não tem sabe que precisa anotar.
        run: node web/testar-historico-exato.mjs

      - name: Testar a aritmética da conferência
        # Roda em node puro, sem navegador, e por isso vem antes: aritmética
        # errada numa ferramenta que diz quanto você ganhou é pior do que
        # ferramenta nenhuma, e não faz sentido instalar um navegador para
        # descobrir que a multiplicação está errada.
        run: node web/testar-aritmetica.mjs

      - name: Testar a interface num navegador
        run: |
          # Sob a mesma subpasta em que o GitHub Pages serve. Um caminho
          # absoluto funcionaria na raiz e quebraria só depois de publicado.
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node web/testar.mjs "/${GITHUB_REPOSITORY#*/}/"

          # E a atualização automática, que é o que garante que uma correção
          # publicada chegue de fato ao aparelho de quem já usava o aplicativo.
          node web/testar-atualizacao.mjs

          # E a tela de Configurações, que é onde o usuário pergunta "estou na
          # versão mais nova?" e recebe uma resposta. As três situações são
          # servidas de propósito — nada novo, versão nova publicada, e sem
          # internet —, porque um botão que sempre diz "tudo em dia" é pior do
          # que botão nenhum.
          node web/testar-configuracoes.mjs

          # E o histórico: nenhum trabalho pode se perder, e continuar um
          # trabalho tem de atualizar o registro dele, não criar outro ao lado.
          node web/testar-historico.mjs

          # E a Lotinha: os fechamentos do banco embutido são conferidos
          # sorteio a sorteio por uma terceira implementação, que não
          # compartilha código nem com o motor nem com o validador do app.
          node web/testar-lotinha.mjs

          # E a checagem: a contagem de acertos é aritmética, e aritmética
          # errada numa ferramenta de conferência é pior do que ferramenta
          # nenhuma. Aqui cada faixa de 11 a 15 é montada à mão e cobrada.
          node web/testar-checagem.mjs

          # E o Construtor, que faz a afirmação mais cara de errar do site:
          # "esta é a menor solução que existe". Aqui ela é cobrada num caso de
          # mínimo publicado, onde a escada tem de parar exatamente no número
          # provado — e num caso em aberto, onde ela não pode declarar prova
          # nenhuma.

          # E o Construtor Exato, que faz a mesma afirmação sem apoio nenhum:
          # ele não consulta tabela de mínimos de ninguém. O que se cobra aqui é
          # a separação entre encontrar e provar — que ele diga "mínimo exato"
          # onde a varredura fechou, mostre os dois números onde ela não fechou,
          # e que a exaustão suba o piso acima da fórmula em C(10,4,2). E, desde
          # a conferência, que o dinheiro na tela seja o que a aritmética diz.
          node web/testar-exato.mjs

      - name: Conferir o aplicativo de fechamentos antes de levá-lo junto
        # O segundo aplicativo deste repositório promete "está garantido", e o
        # que sustenta a promessa é a varredura: todos os sorteios possíveis de
        # cada um dos 312 fechamentos publicados, conferidos por um binário que
        # não compartilha uma linha com o gerador.
        #
        # Uma falha aqui bloqueia a publicação **do site inteiro**, de propósito.
        # `catalogo.yml` roda o mesmo a cada envio, mas roda em paralelo com este
        # fluxo: se a decisão de publicar dependesse dele, publicar-se-ia sem
        # saber. Pôr no ar um endereço que promete o que não confere é pior do
        # que não publicar a correção de texto que vinha junto.
        run: |
          cargo build --release --bin conferir-tudo
          ./target/release/conferir-tudo catalogo
          node app/testar-estrategia.mjs
          node app/testar-catalogo.mjs
          node app/testar-conferir.mjs
          node servidor/testar-intencao.mjs
          node servidor/testar-explicar.mjs
          ./construir-app.sh
          node app/testar-tela.mjs "/${GITHUB_REPOSITORY#*/}/fechamentos/"
          node ferramentas/testar-convivencia.mjs "/${GITHUB_REPOSITORY#*/}/"
          ./target/release/conferir-tudo publicar/catalogo

      - name: Construir o aplicativo de fechamentos no lugar dele
        # Numa subpasta, ao lado do motor, e não no lugar dele: são dois
        # aplicativos com dois públicos, e o endereço de cada um continua sendo o
        # que sempre foi. O service worker de `fechamentos/` tem escopo mais
        # específico que o da raiz, então é ele que atende as páginas de lá.
        #
        # Depois de `testar-construcao.sh`, que reconstrói `site/` do zero e
        # cobra que todo arquivo dali esteja na lista de uso sem internet do
        # motor — lista que não fala, nem deve falar, dos arquivos do outro
        # aplicativo.
        run: |
          ./construir-app.sh site/fechamentos
          ./target/release/conferir-tudo site/fechamentos/catalogo

      - name: Publicar na branch gh-pages
        run: |
          set -euo pipefail

          # Um repositório novo dentro de site/, com um único commit. A branch
          # de publicação não guarda histórico de propósito: ela é resultado de
          # build, e manter versões antigas de WebAssembly só faria o clone
          # crescer sem servir para nada.
          cd site
          git init -q
          git checkout -qb gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publicação de ${GITHUB_SHA::7}

          Conteúdo gerado por construir-web.sh (raiz) e construir-app.sh
          (fechamentos/). Esta branch existe apenas para o GitHub Pages servir;
          não editar aqui."

          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Onde ficou
        run: |
          dono="${GITHUB_REPOSITORY%%/*}"
          nome="${GITHUB_REPOSITORY#*/}"
          echo "Motor:       https://${dono}.github.io/${nome}/"
          echo "Fechamentos: https://${dono}.github.io/${nome}/fechamentos/"
