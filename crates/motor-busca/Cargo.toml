[package]
name = "motor-busca"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Motor de busca persistente e auto-reconstrutiva"

[dependencies]
motor-core = { workspace = true }
rand = { workspace = true }
rand_pcg = { workspace = true }

# No navegador não existe relógio de sistema; `web-time` cobre `Instant` com
# `performance.now()` mantendo a mesma interface.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"
