[workspace]
resolver = "2"
members = [
    "crates/motor-core",
    "crates/motor-busca",
    "crates/motor-persistencia",
    "crates/motor-cli",
    "crates/motor-web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/jefersondias043-code/sonho-l-cido"

[workspace.dependencies]
motor-core = { path = "crates/motor-core" }
motor-busca = { path = "crates/motor-busca" }
motor-persistencia = { path = "crates/motor-persistencia" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
# `serde1` deixa o estado do gerador atravessar um arquivo de sessão. Sem ele,
# retomar re-semeia da semente inicial e a busca repete as decisões que já
# tinha tomado — o oposto de continuar de onde parou.
rand_pcg = { version = "0.3", features = ["serde1"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
